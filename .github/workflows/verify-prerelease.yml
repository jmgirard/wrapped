# Runs python3 tests/verify.py with Quarto's pre-release channel. It runs
# weekly and by hand, never on a pull request, so a failure here reports a
# coming Quarto change and blocks no merge.
name: verify-prerelease

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release
          tinytex: true

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Binaries need no system packages, and Quarto brings its own pandoc,
      # so pak skips apt. The step must not install release Quarto over the
      # pre-release one.
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: false
        with:
          packages: any::knitr, any::rmarkdown
          install-quarto: false

      - name: Install poppler
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 poppler-utils

      - name: Run verify.py
        run: python3 tests/verify.py

      # The fixture.pdf left here is the Typst render, which overwrites the
      # LaTeX one.
      - name: Keep the rendered outputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-outputs
          path: |
            tests/**/*.html
            tests/**/*.pdf
            tests/**/*.tex
            tests/**/*.typ
            tests/**/*.docx
            tests/**/*.log
          if-no-files-found: ignore
