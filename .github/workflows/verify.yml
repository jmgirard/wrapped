# Renders the test fixtures with Quarto's release channel and compares them
# with the snapshots in tests/_snapshots/ (python3 tests/verify.py).
name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "cairn/**"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs on main are
# never cancelled, so each commit there gets its own check.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release
          tinytex: true

      - name: Install R, knitr, rmarkdown, and poppler
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 r-base r-cran-knitr r-cran-rmarkdown poppler-utils

      - name: Run verify.py
        run: python3 tests/verify.py

      # The fixture.pdf left here is the Typst render, which overwrites the
      # LaTeX one.
      - name: Keep the rendered outputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-outputs
          path: |
            tests/**/*.html
            tests/**/*.pdf
            tests/**/*.tex
            tests/**/*.typ
            tests/**/*.docx
            tests/**/*.log
          if-no-files-found: ignore
