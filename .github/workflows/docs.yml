# Renders the documentation site in docs/ (quarto render docs). Code cells
# take their results from the committed docs/_freeze/, so this job needs no R.
name: docs

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "_extensions/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release
          tinytex: true

      - name: Render the site
        run: quarto render docs
